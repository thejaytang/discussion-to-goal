<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc"><title id="title">Discussion to Goal</title><desc id="desc">From a good conversation to a goal worth pursuing.</desc><rect width="1280" height="400" rx="24" fill="#f8faf6"/><path d="M1040 0h240v178c-110 0-240-48-240-178" fill="#e1ede4"/><g font-family="Arial, Helvetica, PingFang SC, Microsoft YaHei, sans-serif"><rect x="64" y="38" width="156" height="28" rx="14" fill="#193d32"/><text x="142" y="57" fill="#ffffff" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.8">CODEX SKILL</text><text x="60" y="136" fill="#142d29" font-size="66" font-weight="700" letter-spacing="-2">Discussion to Goal</text><text x="64" y="181" fill="#557069" font-size="24">From a good conversation to a goal worth pursuing.</text><rect x="64" y="236" width="356" height="78" rx="14" fill="#eaf0fa"/><text x="88" y="282" fill="#1c3442" font-size="18" font-weight="600">01</text><text x="130" y="282" fill="#1c3442" font-size="18" font-weight="600">DISCUSSION</text><path d="M429 275h14m-5-5 5 5-5 5" fill="none" stroke="#6b8b80" stroke-width="2"/><rect x="452" y="236" width="356" height="78" rx="14" fill="#ddefe5"/><text x="476" y="282" fill="#1c3442" font-size="18" font-weight="600">02</text><text x="518" y="282" fill="#1c3442" font-size="18" font-weight="600">CLEAR GOAL</text><path d="M817 275h14m-5-5 5 5-5 5" fill="none" stroke="#6b8b80" stroke-width="2"/><rect x="840" y="236" width="356" height="78" rx="14" fill="#f9e9d5"/><text x="864" y="282" fill="#1c3442" font-size="18" font-weight="600">03</text><text x="906" y="282" fill="#1c3442" font-size="18" font-weight="600">VERIFIABLE PROGRESS</text><text x="64" y="362" fill="#587169" font-size="17">Keep the decisions. Define what done means. Start moving.</text><circle cx="1180" cy="84" r="25" fill="none" stroke="#578f76" stroke-width="2"/><circle cx="1180" cy="84" r="13" fill="none" stroke="#578f76" stroke-width="2"/><circle cx="1180" cy="84" r="4" fill="#578f76"/></g></svg>